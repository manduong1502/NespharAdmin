# ==============================================================================
# Nginx Hardened Reverse Proxy + Anti-DDoS Config for NESPHAR Ubuntu Mini Server
# Đặt tại: /etc/nginx/sites-available/nesphar.conf
# Kích hoạt: sudo ln -sf /etc/nginx/sites-available/nesphar.conf /etc/nginx/sites-enabled/
# Cấp SSL tự động: sudo certbot --nginx -d api.nesphar.vn
# ==============================================================================

# --- Vùng nhớ chống DDoS Layer-7 & Brute-force theo IP ---
limit_req_zone  $binary_remote_addr zone=nesphar_api_general:10m rate=15r/s;
limit_req_zone  $binary_remote_addr zone=nesphar_auth_strict:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=nesphar_order_write:10m rate=15r/m;
limit_conn_zone $binary_remote_addr zone=nesphar_conn_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.nesphar.vn admin.nesphar.vn;

    # Ẩn phiên bản Nginx khỏi Header
    server_tokens off;

    # Giới hạn tối đa 25 kết nối đồng thời / 1 IP & chống Slowloris
    limit_conn nesphar_conn_per_ip 25;
    limit_req_status 429;
    limit_conn_status 429;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 10s;

    # Cho phép tải ảnh sản phẩm & hồ sơ PDF công bố Bộ Y Tế tối đa 16MB
    client_max_body_size 16M;

    # Chặn tức thì (TCP Reset 444 - tốn 0% CPU) các bot dò quét lỗ hổng phổ biến
    location ~* (?:\.(?:env|git|svn|htaccess|bak|sql)|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin) {
        return 444;
    }

    # Nén Gzip tối ưu tốc độ tải trên mạng 4G Zalo Mini App
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chống Brute-Force mật khẩu đăng nhập Web Admin
    location = /api/v1/admin/auth/login {
        limit_req zone=nesphar_auth_strict burst=4 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chống Bot spam đơn hàng ảo làm nghẽn tồn kho FEFO
    location = /api/v1/miniapp/orders {
        limit_req zone=nesphar_order_write burst=6 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kho ảnh & PDF công bố Bộ Y Tế (chặn thực thi script bằng Sandbox CSP)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
    }

    # REST API chung cho Zalo Mini App & Web Admin
    location /api/ {
        limit_req zone=nesphar_api_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Giao diện Web Admin SPA
    location / {
        limit_req zone=nesphar_api_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
